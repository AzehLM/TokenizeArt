<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>42SocietyGenArt</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
			background: #111;
			color: #eee;
			justify-content: center;
			min-height: 100vh;
			padding: 4rem 2rem;
			overflow-x: hidden;
		}

		.video-bg {
			position: fixed;
			inset: 0;
			z-index: -1;
			overflow: hidden;
		}

		.video-bg video {
			position: absolute;
			top: 50%;
			left: 50%;
			min-width: 100%;
			min-height: 100%;
			transform: translate(-50%, -50%);
			object-fit: cover;
			transition: opacity 1.5s ease;
		}

		.video-bg::after {
			content: "";
			position: absolute;
			inset: 0;
			background: rgba(0, 0, 0, 0.40);
		}

		main {
			width: 100%;
			max-width: 860px;
		}

		.hero {
			text-align: center;
			margin-bottom: 2rem;
		}

		h1 {
			font-size: 2.5rem;
			margin-bottom: 0.5rem;
			letter-spacing: -1px;
		}

		h1 span {
			font-weight: 300;
		}

		.subtitle {
			color: rgba(255, 255, 255, 0.5);
			font-size: 0.85rem;
			letter-spacing: 2px;
			text-transform: uppercase;
		}

		.cards {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 2rem;
		}

		@media (max-width: 640px) {
			.cards {
				grid-template-columns: 1fr;
			}
			h1 {
				font-size: 1.8rem;
			}
		}

		.card {
			background: rgba(255, 255, 255, 0.08);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			border: 1px solid rgba(255, 255, 255, 0.12);
			border-radius: 12px;
			padding: 2rem;
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}

		.card h2 {
			font-size: 1.2rem;
			text-align: left;
		}

		.card p {
			color: rgba(255, 255, 255, 0.55);
			font-size: 0.85rem;
			line-height: 1.6;
		}

		.wallet-status {
			font-size: 0.75rem;
			color: rgba(255, 255, 255, 0.4);
			padding: 0.4rem 0.8rem;
			background: rgba(255, 255, 255, 0.05);
			border-radius: 6px;
			word-break: break-all;
		}

		.wallet-status.connected {
			color: #5ecc89;
			background: rgba(94, 204, 137, 0.1);
		}

		.mint-btn {
			font-family: inherit;
			font-size: 0.9rem;
			font-weight: 600;
			letter-spacing: 1px;
			text-transform: uppercase;
			padding: 0.9rem 1.5rem;
			border: 1px solid rgba(255, 255, 255, 0.25);
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.1);
			color: #fff;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.mint-btn:hover {
			background: rgba(255, 255, 255, 0.9);
			color: #111;
		}

		.mint-btn:disabled {
			opacity: 0.35;
			cursor: not-allowed;
		}

		.mint-btn:disabled:hover {
			background: rgba(255, 255, 255, 0.1);
			color: #fff;
		}

		.feedback {
			font-size: 0.8rem;
			color: #888;
			min-height: 1.2em;
		}

		.feedback.error {
			color: rgb(247, 174, 168, 1);
		}

		.feedback.success {
			color: #2a7d4f;
		}

		.cta {
			position: relative;
			border: none;
			background: none;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			gap: 8px;
			text-decoration: none;
			color: #eee;
			align-self: flex-start;
			margin-top: auto;
		}

		.cta::after {
			content: "";
			position: absolute;
			left: 0;
			bottom: 0;
			width: 100%;
			height: 2px;
			background-color: #fff;
			transform: scaleX(0);
			transform-origin: bottom right;
			transition: transform 0.3s ease;
		}

		.cta:hover::after {
			transform: scaleX(1);
			transform-origin: bottom left;
		}

		.cta span {
			padding-bottom: 5px;
			letter-spacing: 1px;
			font-size: 14px;
			text-transform: uppercase;
			font-weight: 500;
		}

		.cta svg {
			transform: translateX(-8px);
			transition: all 0.3s ease;
			width: 20px;
			height: 12px;
		}

		.cta:hover svg {
			transform: translateX(0);
		}

		.cta svg path {
			fill: #eee;
		}

		footer {
			margin-top: 2.5rem;
			font-size: 0.75rem;
			color: rgba(255, 255, 255, 1);
			text-align: center;
		}

		footer a {
			color: rgba(255, 255, 255, 0.45);
		}
	</style>
</head>

<body>
	<div class="video-bg">
		<video src="assets/bg.mp4" autoplay muted loop playsinline></video>
	</div>

	<main>
		<div class="hero">
			<h1>42Society<span>GenArt</span></h1>
			<p class="subtitle">ERC-721 · Sepolia Testnet</p>
		</div>

		<div class="cards">
			<div class="card">
				<h2>Mint</h2>
				<p>Mint our art piece.<br>Requires 42Society (FS42) token ownership.</p>
				<div id="walletStatus1" class="wallet-status">
					Not connected
				</div>
				<button id="mintBtn1" class="mint-btn" disabled>
					Connect Wallet
				</button>
				<div id="feedback1" class="feedback"></div>
			</div>

			<div class="card">
				<h2>Mint</h2>
				<p>Mint a 42 svg art piece.<br>Does not require 42Society token.</p>
				<div id="walletStatus2" class="wallet-status">
					Not connected
				</div>
				<button id="mintBtn2" class="mint-btn" disabled>
					Connect Wallet
				</button>
				<div id="feedback2" class="feedback"></div>
			</div>
		</div>

		<footer>
			<p>42SocietyGenArt · <a href="https://sepolia.etherscan.io/address/CONTRACT_ADDRESS" id="etherscanLink" target="_blank">View on Etherscan</a></p>
		</footer>
	</main>

	<script>
		const CONTRACT_ADDRESS = "0xA6e1E1fD9da9c33249DB466410E69023B48A0F81"; // mandatory nft smart contract address
		const ONCHAIN_CONTRACT_ADDRESS = "0x552b1726694e330f3f249DF598018DbDf5F1CB80"; // bonus nft smart contract address
		const FS42_ADDRESS     = "0xC033D60d6C2f4cd561C4f77019Cf2790F4e825AB"; // FS42 token smart contract address which is used to verify the minter has tokens

		// ethers.js readable ABI (Application Binary Interface) that encodes the calls to smart contracts methods
		const NFT_ABI = [
			"function mint() external",
			"function totalSupply() view returns (uint256)",
			"function balanceOf(address) view returns (uint256)"
		];

		const FS42_ABI = [
			"function balanceOf(address) view returns (uint256)"
		];

		let provider, signer;

		const card1 = {
			btn:      document.getElementById("mintBtn1"),
			status:   document.getElementById("walletStatus1"),
			feedback: document.getElementById("feedback1"),
			address:  CONTRACT_ADDRESS,
			gated:    true
		};

		const card2 = {
			btn:      document.getElementById("mintBtn2"),
			status:   document.getElementById("walletStatus2"),
			feedback: document.getElementById("feedback2"),
			address:  ONCHAIN_CONTRACT_ADDRESS,
			gated:    false
		};

		async function connectWallet(card) {

			if (!window.ethereum) {
				showFeedback(card, "Install MetaMask to continue", "error");
				return ;
			}

			try {
				provider = new ethers.BrowserProvider(window.ethereum); // open the Metamask extension to connect
				signer = await provider.getSigner();
				const addr = await signer.getAddress();

				card.status.textContent = addr;
				card.status.classList.add("connected");

				card.btn.textContent	= "Mint";
				card.btn.disabled	= false;
				card.btn.onclick		= () => mint(card);
			} catch (e) {
				showFeedback(card, "Connection refused", "error");
			}
		}

		async function mint(card) {

			card.btn.disabled = true;

			try {
				if (card.gated) {
					showFeedback(card, "Checking FS42 balance…", "");

					// Check FS42 ownership
					const fs42	= new ethers.Contract(FS42_ADDRESS, FS42_ABI, provider);
					const bal	= await fs42.balanceOf(await signer.getAddress()); // calls balanceOf on the FS42 token for the connected user that wants to mint

					if (bal === 0n) {
						showFeedback(card, "You need FS42 tokens to mint", "error");
						card.btn.disabled = false;
						return;
					}
				}

				showFeedback(card, "Confirm transaction in MetaMask…", "");

				const nftContract = new ethers.Contract(card.address, NFT_ABI, signer);
				const tx = await nftContract.mint();

				showFeedback(card, "Transaction sent — waiting…", "");
				await tx.wait();

				showFeedback(card, "Minted successfully!", "success");
			} catch (e) {
				const msg = e.reason || e.message || "Transaction failed";
				showFeedback(card, msg.substring(0, 80), "error");
			}
			card.btn.disabled = false;
		}

		function showFeedback(card, msg, type) {
			card.feedback.textContent = msg;
			card.feedback.className   = "feedback" + (type ? " " + type : "");
		}

		card1.btn.onclick = () => connectWallet(card1);
		card2.btn.onclick = () => connectWallet(card2);
		card1.btn.disabled = false;
		card2.btn.disabled = false;
	</script>
</body>
</html>
